<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>華夏土木包工業</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --steel: #0D0E10;
    --steel-deep: #050506;
    --plate: #1A1B1E;
    --chrome: #C9CDD3;
    --chrome-dim: #6E7278;
    --paper: #E8E9EB;
    --ink-soft: #85898F;
    --line: #2A2C30;
  }

  html, body { height: 100%; overflow: hidden; }
  *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  * { scrollbar-width: none; -ms-overflow-style: none; }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--steel);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 26px 26px;
    background-position: center;
    color: var(--paper);
    font-family: 'Noto Sans TC', -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: var(--plate);
    border-radius: 6px;
    position: relative;
    box-shadow: 0 20px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
    opacity: 0;
    animation: rise 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    overflow: hidden;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none !important; opacity: 1 !important; transform: none !important; }
  }

  /* corner rivets — structural plate detail */
  .rivet {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--steel-deep);
    box-shadow: inset 0 1px 1px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.06);
  }
  .rivet.tl { top: 10px; left: 10px; }
  .rivet.tr { top: 10px; right: 10px; }
  .rivet.bl { bottom: 10px; left: 10px; }
  .rivet.br { bottom: 10px; right: 10px; }

  /* brushed chrome shine bar */
  .hazard-bar {
    height: 6px;
    width: 100%;
    background: linear-gradient(
      90deg,
      var(--steel-deep) 0%,
      var(--chrome-dim) 20%,
      var(--chrome) 42%,
      #FFFFFF 50%,
      var(--chrome) 58%,
      var(--chrome-dim) 80%,
      var(--steel-deep) 100%
    );
  }

  .body {
    padding: 26px 26px 20px;
  }

  .tag {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--chrome);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .company {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 1px;
    line-height: 1.2;
    margin-bottom: 6px;
    background: linear-gradient(180deg, #FFFFFF 0%, var(--chrome) 45%, var(--chrome-dim) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .company-en {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 3px;
    color: var(--ink-soft);
    text-transform: uppercase;
  }

  .divider {
    height: 1px;
    background: var(--line);
    margin: 18px 0;
    position: relative;
  }
  .divider::before {
    content: '';
    position: absolute;
    left: 0; top: -1px;
    width: 34px;
    height: 3px;
    background: var(--chrome);
  }

  .person-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 20px;
  }

  .person-name {
    font-size: 17px;
    font-weight: 700;
  }

  .person-role {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 1px;
    color: var(--ink-soft);
  }

  .contacts {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .contact {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 14px;
    background: var(--steel-deep);
    border-radius: 4px;
    text-decoration: none;
    color: var(--paper);
    border-left: 3px solid var(--chrome-dim);
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .contact:hover, .contact:focus-visible {
    background: #050506;
    border-left-color: var(--chrome);
    outline: none;
  }

  .contact .icon {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    color: var(--chrome);
  }
  .contact .icon svg {
    width: 100%; height: 100%;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .contact .text { flex: 1; min-width: 0; }
  .contact .label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--ink-soft);
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .contact .value {
    font-size: 14.5px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .footer {
    padding: 16px 26px 20px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 3px;
    color: var(--ink-soft);
    text-transform: uppercase;
    border-top: 1px solid var(--line);
  }
</style>
</head>
<body>

<div class="card">
  <div class="rivet tl"></div>
  <div class="rivet tr"></div>
  <div class="rivet bl"></div>
  <div class="rivet br"></div>

  <div class="hazard-bar"></div>

  <div class="body">
    <div class="tag">土木工程 · 營造包工</div>
    <div class="company">華夏土木包工業</div>
    <div class="company-en">HUAXIA CIVIL ENGINEERING</div>

    <div class="divider"></div>

    <div class="person-row">
      <span class="person-name">羅偉廷</span>
      <span class="person-role">負責人</span>
    </div>

    <div class="contacts">
      <a class="contact" href="tel:+886928957481">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>
        <span class="text">
          <div class="label">電話 TEL</div>
          <div class="value">0928 957 481</div>
        </span>
      </a>

      <a class="contact" href="https://line.me/ti/p/~0928957481" target="_blank" rel="noopener">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span>
        <span class="text">
          <div class="label">LINE</div>
          <div class="value">加入好友</div>
        </span>
      </a>
    </div>
  </div>

  <div class="footer">建築 · 結構 · 基礎工程</div>
</div>

</body>
</html>
