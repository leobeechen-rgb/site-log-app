<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>連線測試</title>
<style>
body{margin:0;padding:24px;background:#EFEBE3;color:#2A2824;font-family:-apple-system,"PingFang TC",sans-serif;line-height:1.8}
h1{font-size:20px;margin:0 0 16px}
#out{background:#fff;border:1px solid #CFC8BA;padding:14px;border-radius:6px;font-size:15px;white-space:pre-wrap}
</style>
</head>
<body>
<h1>工地紀錄本 連線測試</h1>
<div id="out">測試中…</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async function () {
  const out = document.getElementById("out");
  const lines = [];
  const show = (t) => { lines.push(t); out.textContent = lines.join("\n"); };
  show("頁面版本：ping-1（2026-09-24）");
  try {
    const sb = window.supabase.createClient(
      "https://rqndozhhvuimqjqtmeli.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxbmRvemhodnVpbXFqcXRtZWxpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5Njc1ODIsImV4cCI6MjA5OTU0MzU4Mn0.meaGT1veRt9acHCl4Dcrpk9jxjNzrkFKWfs_96C6qLw"
    );
    const isNative = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.herfulsinsPush);
    show("原生推播通道：" + (isNative ? "有（在 App 內）" : "沒有（一般瀏覽器）"));
    const { error } = await sb.rpc("hb_debug", { p_tag: "ping", p_message: "ping 頁面測試，原生通道=" + isNative + "，UA=" + navigator.userAgent.slice(0, 120) });
    show(error ? ("回報伺服器失敗：" + error.message) : "回報伺服器成功");
  } catch (e) {
    show("發生錯誤：" + (e && e.message ? e.message : e));
  }
  show("完成，請把這個畫面截圖回傳。");
})();
</script>
</body>
</html>
