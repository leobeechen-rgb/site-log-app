<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF 轉正｜赫柏空間設計</title>
<link rel="manifest" href="/pdf-rotate.webmanifest">
<link rel="icon" type="image/png" href="/pdf-rotate-icon-180.png">
<link rel="apple-touch-icon" href="/pdf-rotate-icon-180.png">
<meta name="apple-mobile-web-app-title" content="PDF 轉正">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1E1C19">
<style>
:root{--bg:#F4F1EA;--card:#FBFAF7;--ink:#2A2622;--soft:#7E786C;--line:rgba(160,146,124,.35);--acc:#6E1C24;--dark:#22392F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
header{background:#1E1C19;color:#F1EEE6;padding:16px 22px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header b{letter-spacing:.32em;font-weight:400;font-size:17px}
header span{font-size:13px;letter-spacing:.12em;opacity:.75}
main{max-width:1180px;margin:0 auto;padding:22px 16px 120px}
.drop{display:block;border:1.5px dashed var(--line);background:var(--card);padding:38px 18px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s}
.drop.on{border-color:var(--acc);background:#fff}
.drop h2{margin:0 0 6px;font-weight:400;font-size:19px;letter-spacing:.08em}
.drop p{margin:0;color:var(--soft);font-size:13px;line-height:1.8}
.bar{display:none;position:sticky;top:0;z-index:5;background:rgba(244,241,234,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:12px 0;margin-top:14px;border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap;align-items:center}
.bar.show{display:flex}
.bar .name{flex:1 1 200px;font-size:13px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--ink)}
button.solid{background:var(--dark);color:#F1EEE6;border-color:var(--dark)}
button.solid:disabled{opacity:.5;cursor:default}
.hint{font-size:12.5px;color:var(--soft);margin:12px 2px 0;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;margin-top:16px}
.pg{background:var(--card);border:1px solid var(--line);padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.pg.chg{border-color:var(--acc)}
.thumb{width:150px;height:150px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.thumb canvas{max-width:150px;max-height:150px;box-shadow:0 1px 4px rgba(0,0,0,.18);background:#fff;transition:transform .25s ease}
.pg .row{display:flex;gap:6px;align-items:center}
.pg .row button{padding:5px 11px;font-size:15px;line-height:1}
.pg small{font-size:12px;color:var(--soft)}
.pg small b{color:var(--acc);font-weight:500}
.msg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1E1C19;color:#F1EEE6;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none}
.msg.show{opacity:1}
</style>
</head>
<body>
<header><b>HERFULSINS</b><span>PDF 轉正小工具</span></header>
<main>
  <label class="drop" id="drop">
    <h2>把 PDF 拖到這裡，或點一下選檔</h2>
    <p>點頁面縮圖就能轉 90 度，轉好按「下載轉正的 PDF」。<br>檔案只在你的電腦上處理，不會上傳。</p>
    <input type="file" id="file" accept="application/pdf,.pdf" hidden>
  </label>

  <div class="bar" id="bar">
    <span class="name" id="name"></span>
    <button type="button" id="allL" title="全部頁面逆時針轉 90 度">全部 ↺</button>
    <button type="button" id="allR" title="全部頁面順時針轉 90 度">全部 ↻</button>
    <button type="button" id="toP" title="橫的頁面轉成直的">橫的都轉直</button>
    <button type="button" id="toL" title="直的頁面轉成橫的">直的都轉橫</button>
    <button type="button" id="reset">還原</button>
    <button type="button" class="solid" id="save">下載轉正的 PDF</button>
  </div>
  <p class="hint" id="hint" style="display:none">點縮圖＝順時針轉 90 度；下面的 ↺ ↻ 可以單頁轉。有轉過的頁面會有紅框。</p>
  <div class="grid" id="grid"></div>
</main>
<div class="msg" id="msg"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=id=>document.getElementById(id);
let bytes=null, fname='', pages=[]; // {orig, add, w, h, el, cv}
function say(t){const m=$('msg');m.textContent=t;m.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>m.classList.remove('show'),2200)}
function norm(d){return((d%360)+360)%360}
function paint(p){
  p.cv.style.transform='rotate('+p.add+'deg)';
  const total=norm(p.orig+p.add);
  p.info.innerHTML='第 '+p.n+' 頁'+(p.add?'　<b>已轉 '+(norm(p.add)===270?'↺ 90°':norm(p.add)===90?'↻ 90°':'180°')+'</b>':'');
  p.el.classList.toggle('chg',norm(p.add)!==0);
}
function turn(p,d){p.add=norm(p.add+d);paint(p)}
// 目前畫面上看到的是不是橫的（考慮原本的旋轉）
function isWide(p){const r=norm(p.add);const w=p.w,h=p.h;return (r===90||r===270)?h>w:w>h}

async function openFile(f){
  if(!f)return;
  if(!/pdf$/i.test(f.type)&&!/\.pdf$/i.test(f.name)){say('請選 PDF 檔');return}
  fname=f.name.replace(/\.pdf$/i,'');
  bytes=new Uint8Array(await f.arrayBuffer());
  $('name').textContent=f.name; $('bar').classList.add('show'); $('hint').style.display='';
  const grid=$('grid'); grid.innerHTML=''; pages=[];
  const doc=await pdfjsLib.getDocument({data:bytes.slice()}).promise;
  for(let i=1;i<=doc.numPages;i++){
    const pg=await doc.getPage(i);
    const vp1=pg.getViewport({scale:1});           // 已含原本的旋轉
    const sc=150/Math.max(vp1.width,vp1.height);
    const vp=pg.getViewport({scale:sc*(window.devicePixelRatio||1)});
    const cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height;
    cv.style.width=(vp.width/(window.devicePixelRatio||1))+'px';
    await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
    const el=document.createElement('div'); el.className='pg';
    const th=document.createElement('div'); th.className='thumb'; th.appendChild(cv);
    const row=document.createElement('div'); row.className='row';
    const bl=document.createElement('button'); bl.type='button'; bl.textContent='↺'; bl.title='逆時針 90 度';
    const br=document.createElement('button'); br.type='button'; br.textContent='↻'; br.title='順時針 90 度';
    const info=document.createElement('small');
    row.append(bl,br); el.append(th,row,info); grid.appendChild(el);
    const p={n:i,orig:pg.rotate||0,add:0,w:vp1.width,h:vp1.height,el,cv,info};
    th.onclick=()=>turn(p,90); bl.onclick=()=>turn(p,-90); br.onclick=()=>turn(p,90);
    pages.push(p); paint(p);
  }
  say('共 '+doc.numPages+' 頁');
}
$('file').onchange=e=>openFile(e.target.files[0]);
const drop=$('drop');
['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('on')}));
['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('on')}));
drop.addEventListener('drop',e=>openFile(e.dataTransfer.files[0]));
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();if(e.target.closest&&e.target.closest('#drop'))return;openFile(e.dataTransfer.files[0])});

$('allL').onclick=()=>pages.forEach(p=>turn(p,-90));
$('allR').onclick=()=>pages.forEach(p=>turn(p,90));
$('toP').onclick=()=>{let n=0;pages.forEach(p=>{if(isWide(p)){turn(p,90);n++}});say(n?'轉了 '+n+' 頁（若上下顛倒，再點那頁轉 180°）':'沒有橫的頁面')};
$('toL').onclick=()=>{let n=0;pages.forEach(p=>{if(!isWide(p)){turn(p,-90);n++}});say(n?'轉了 '+n+' 頁':'沒有直的頁面')};
$('reset').onclick=()=>pages.forEach(p=>{p.add=0;paint(p)});

$('save').onclick=async()=>{
  if(!bytes)return;
  const btn=$('save'); btn.disabled=true; btn.textContent='處理中…';
  try{
    const pdf=await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:true});
    pdf.getPages().forEach((pg,i)=>{const p=pages[i]; if(p&&p.add) pg.setRotation(PDFLib.degrees(norm(p.orig+p.add)))});
    const out=await pdf.save();
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([out],{type:'application/pdf'}));
    a.download=fname+'_轉正.pdf'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    say('已下載：'+fname+'_轉正.pdf');
  }catch(e){say('無法處理這個 PDF：'+(e.message||e))}
  btn.disabled=false; btn.textContent='下載轉正的 PDF';
};
</script>
</body>
</html>
