<title>客戶基本資料表｜赫柏空間設計</title>
<style>
:root{--paper:#faf7f1;--ink:#302c28;--muted:#777067;--line:#d7cdbf;--accent:#75232d}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.7}main{max-width:760px;margin:0 auto;padding:52px 32px 36px}header{text-align:center;margin-bottom:42px}.brand{font-family:Georgia,serif;letter-spacing:.24em;font-size:25px;margin:0 0 4px}.brand-cn{font-size:12px;letter-spacing:.35em;color:var(--muted)}.eyebrow{font-size:10px;letter-spacing:.21em;color:var(--accent);margin:20px 0 10px}h1{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-weight:400;font-size:29px;letter-spacing:.16em;margin:0}header p{font-size:13px;color:var(--muted);margin:12px 0 0}.section-title{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:0 0 14px;margin-bottom:24px}.section-title h2{font-weight:500;font-size:16px;border-left:3px solid var(--accent);padding-left:12px;margin:0;letter-spacing:.1em}.section-title span{font-size:12px;color:var(--muted)}.field{margin-bottom:22px}label{display:block;margin-bottom:8px;font-size:14px;color:#5c554d}label span{font-size:12px;color:var(--muted);margin-left:6px}.required{color:var(--accent)}input{display:block;width:100%;border:1px solid #cfc4b6;border-radius:8px;padding:14px 16px;min-height:52px;background:#fffdf9;font:inherit;font-size:16px;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}input::placeholder{color:#a19a91}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #95503e15}input[aria-invalid=true]{border-color:#a33328}.error{font-size:12px;color:#a33328;margin:5px 0 0;min-height:0}.note{font-size:12px;color:var(--muted);margin:26px 0 20px;padding:15px 0;border-top:1px solid var(--line)}.actions{display:flex;gap:12px}button{min-height:50px;border-radius:7px;cursor:pointer;font:inherit;font-size:14px;letter-spacing:.08em;padding:12px 22px}button:focus-visible{outline:3px solid #bca27e;outline-offset:3px}.primary{flex:1;border:1px solid var(--accent);background:var(--accent);color:white}.secondary{background:transparent;border:1px solid #b8ac9c;color:#60564b}.primary:hover{background:#804332}.secondary:hover{background:#ebe5db}.status{font-size:13px;color:#4a6149;margin:16px 0 0}footer{font-size:10px;letter-spacing:.13em;text-align:center;color:#958a7c;border-top:1px solid var(--line);margin-top:36px;padding-top:22px}.print-value{display:none}#print-date{display:none}
@media(max-width:480px){main{padding:30px 22px 24px}header{margin-bottom:30px}.brand{font-size:22px}h1{font-size:25px}.actions{flex-direction:column}button{width:100%}.section-title span{font-size:11px}}
@media print{@page{size:A4;margin:22mm}body{background:white;color:#222}main{max-width:none;padding:0}header{margin-bottom:32px}.actions,.note,.status,.error,header>p,.section-title>span{display:none}input{display:none}.print-value{display:block;min-height:50px;white-space:pre-wrap;overflow-wrap:anywhere;border-bottom:1px solid #aaa;padding:9px 4px;font-size:16px}.field{margin-bottom:25px;break-inside:avoid}#print-date{display:block;text-align:right;font-size:12px;color:#777}footer{margin-top:45px}}

/* Approved client-facing design */
body{background:radial-gradient(ellipse at 20% 10%,#fffefa70,transparent 60%),var(--paper)}
main{max-width:1000px;position:relative;margin:18px auto;padding:38px 58px 22px;border:1px solid #ae8757;border-radius:18px;isolation:isolate}
main:before{content:"";position:absolute;inset:3px;border:1px solid #ae875780;border-radius:15px;pointer-events:none;z-index:-1}
.botanical{position:absolute;right:0;top:18px;width:28%;height:350px;object-fit:contain;object-position:top right;opacity:.36;pointer-events:none;z-index:-1}
header{margin-bottom:32px;position:relative}.brand{font-size:28px;color:#a17b4c;letter-spacing:.23em}.brand-cn{color:#a17b4c;font-family:"PMingLiU",serif;font-size:16px;letter-spacing:.34em}.brand-cn:after{content:"— ⋄ —";display:block;letter-spacing:.13em;font-size:18px;margin:12px 0 14px}.eyebrow{font-family:Arial,sans-serif;letter-spacing:.4em;font-size:12px;margin:0 0 10px}h1{font-size:clamp(28px,5vw,52px);font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;letter-spacing:.16em}header p{font-family:"PMingLiU","Songti TC",serif;font-size:19px;letter-spacing:.15em;line-height:1.9;color:var(--ink);margin-top:12px}
form{padding:30px 38px 20px;background:#fffdfbb5;border:1px solid #d8c5aa;border-radius:13px;box-shadow:0 10px 36px #91724b04}.section-title{border:0;margin-bottom:22px;padding:0}.section-title h2{font-family:"PMingLiU",serif;font-size:24px;border-left:5px solid var(--accent);padding-left:22px}.section-title span{font-size:13px}.field{margin-bottom:20px}label{font-family:"PMingLiU",serif;font-size:19px;letter-spacing:.07em;color:var(--ink)}label span{display:inline-block;vertical-align:middle;padding:0 10px;border:1px solid #baa68d;border-radius:20px;font-family:"Microsoft JhengHei",sans-serif;font-size:12px;line-height:1.8}input{background:#ffffffc9;border-color:#c5b9ac;height:56px;font-size:16px;box-shadow:inset 0 1px 2px #40302302}.hint{color:#857562;font-size:13px;margin:5px 0 0}.note{text-align:center;border-top:1px solid #d6cabc;margin:18px 0;padding:17px 0 0;font-size:13px}.submit{position:relative;width:100%;font-family:"PMingLiU",serif;font-size:24px;letter-spacing:.15em;min-height:60px;border-radius:11px;background:linear-gradient(105deg,#72222c,#82303a 55%,#6c202a);box-shadow:0 7px 16px #75232d14}.submit span:last-child{position:absolute;right:24px;font-family:Arial,sans-serif}.submit:hover{filter:brightness(1.08)}.submit:disabled{opacity:.55;cursor:wait}.after-submit{text-align:center;font-family:"PMingLiU",serif;font-size:14px;color:#76634f;margin:13px 0 0}.status:empty{display:none}.status{border:1px solid #d9c3a9;border-radius:6px;background:#fbf3e6;color:#705334;padding:12px;font-size:13px;line-height:1.7}.error:empty{display:none}footer{margin:14px 0 0;padding:0;border:0;font-family:Georgia,serif;color:#a17b4c;font-size:12px;letter-spacing:.18em}footer:before{content:"— ✦ —";display:block;font-size:13px;line-height:1;margin-bottom:9px}
@media(max-width:700px){main{margin:10px;padding:28px 18px 18px}.botanical{width:31%;height:220px;top:18px;opacity:.24}.brand{font-size:22px}.brand-cn{font-size:13px}header{margin-bottom:24px}header p{font-size:15px;letter-spacing:.07em}.eyebrow{font-size:9px;letter-spacing:.28em}form{padding:22px 18px 16px}.section-title h2{font-size:21px;padding-left:12px}.section-title span{font-size:11px}label{font-size:17px}.field{margin-bottom:18px}input{height:53px;padding:12px;font-size:16px}.submit{font-size:22px;min-height:55px}.hint,.note{font-size:12px}footer{font-size:9px;letter-spacing:.1em}}
@media print{main{margin:0;border:0;padding:0}main:before,.botanical,.submit,.after-submit,.hint{display:none}form{padding:0;border:0;background:white}header h1{font-size:28px}.brand-cn:after,.eyebrow{display:none}.field{margin-bottom:16px}.section-title{margin-bottom:15px}}

</style>

<div class="eyebrow">CLIENT INFORMATION</div>
<h1>客戶基本資料</h1>

<form id="client-form" novalidate>
<div class="section-title"><h2>聯絡資訊</h2><span><b class="required">＊</b> 為必填欄位</span></div>
<div class="field"><label for="client-name">姓名／稱呼 <b class="required">＊</b></label><input id="client-name" name="name" autocomplete="name" maxlength="80" required placeholder="請問該如何稱呼您？" aria-describedby="name-error"><p class="error" id="name-error"></p><div class="print-value" data-for="client-name"></div></div>
<div class="field"><label for="client-phone">聯絡電話 <b class="required">＊</b></label><input id="client-phone" name="phone" type="tel" autocomplete="tel" maxlength="40" required placeholder="請填寫手機或市話" aria-describedby="phone-error"><p class="error" id="phone-error"></p><div class="print-value" data-for="client-phone"></div></div>
<div class="field"><label for="client-occupation">職業 <span>選填</span></label><input id="client-occupation" name="occupation" autocomplete="organization-title" maxlength="100" placeholder="請填寫您的職業" aria-describedby="occupation-error"><p class="error" id="occupation-error"></p><div class="print-value" data-for="client-occupation"></div></div>
<div class="field"><label for="client-email">Email <span>選填</span></label><input id="client-email" name="email" type="email" autocomplete="email" maxlength="160" placeholder="方便接收後續資料" aria-describedby="email-error"><p class="error" id="email-error"></p><div class="print-value" data-for="client-email"></div></div>
<div class="field"><label for="client-address">施工地點 <span>選填</span></label><input id="client-address" name="address" autocomplete="off" maxlength="250" placeholder="請填寫縣市、區域或地址" aria-describedby="address-error"><p class="hint">尚未確定地址，可先填寫預計區域。</p><p class="error" id="address-error"></p><div class="print-value" data-for="client-address"></div></div>

<button class="primary submit" id="submit-button" type="submit"><span>送出資料</span><span aria-hidden="true">⟶</span></button>

// 這把是公開用的 anon key，只能呼叫 hb_survey_submit_open，看不到任何資料。
const SB_URL='https://rqndozhhvuimqjqtmeli.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxbmRvemhodnVpbXFqcXRtZWxpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5Njc1ODIsImV4cCI6MjA5OTU0MzU4Mn0.meaGT1veRt9acHCl4Dcrpk9jxjNzrkFKWfs_96C6qLw';
const form=document.getElementById('client-form');
const names=['name','phone','occupation','email','address'];
const fields=Object.fromEntries(names.map(name=>[name,document.getElementById('client-'+name)]));
const status=document.getElementById('status');
const submitButton=document.getElementById('submit-button');
let submitting=false;
function values(){return Object.fromEntries(Object.entries(fields).map(([key,input])=>[key,input.value.trim()]));}
function validate(){let first=null;const data=values();const errors={name:data.name?'':'請填寫姓名或稱呼。',phone:data.phone?'':'請填寫聯絡電話。',occupation:'',email:(!data.email||fields.email.validity.valid)?'':'請確認 Email 格式，例如 name@example.com。',address:''};if(data.phone&&data.phone.replace(/\D/g,'').length<6)errors.phone='請填寫完整電話，市話請加區碼。';for(const [key,input] of Object.entries(fields)){document.getElementById(key+'-error').textContent=errors[key];input.setAttribute('aria-invalid',errors[key]?'true':'false');if(errors[key]&&!first)first=input;}if(first)first.focus();return !first;}
function preparePrint(){for(const el of document.querySelectorAll('.print-value'))el.textContent=document.getElementById(el.dataset.for).value.trim()||' ';document.getElementById('print-date').textContent='表單日期：'+new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
form.addEventListener('submit',async event=>{event.preventDefault();if(submitting||!validate())return;
submitting=true;submitButton.disabled=true;submitButton.firstElementChild.textContent='傳送中…';status.textContent='正在傳送，請稍候。';
const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),20000);
try{const v=values();const answers={name:v.name,phone:v.phone,occupation:v.occupation,email:v.email,addr:v.address};
const response=await fetch(SB_URL+'/rest/v1/rpc/hb_survey_submit_open',{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+SB_KEY},body:JSON.stringify({p_answers:answers}),signal:controller.signal,credentials:'omit'});
if(!response.ok){let t='';try{t=await response.text()}catch(e){}if(/rate_limited/.test(t)){status.textContent='目前填寫的人比較多，請稍後再試，或直接用 LINE 與我們聯繫。';return}throw Error('HTTP '+response.status)}
status.textContent='資料已成功送出，感謝您的填寫，我們將再與您聯繫。';form.reset();}
catch(error){status.textContent='尚未確認送出成功，已保留您填寫的內容。請稍後再試，或透過原聯絡方式與我們確認。';}
finally{clearTimeout(timer);submitting=false;submitButton.disabled=false;submitButton.firstElementChild.textContent='送出資料';}});
window.addEventListener('beforeprint',preparePrint);
form.addEventListener('input',event=>{if(!submitting)status.textContent='';const key=event.target.name;if(names.includes(key)){document.getElementById(key+'-error').textContent='';event.target.setAttribute('aria-invalid','false');}});
</script>
</body>
