<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>赫柏 · 作品資訊卡產生器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F1EE; --card:#FFFFFF; --ink:#111214; --muted:#6E7075; --dim:#A0A2A6;
  --rule:#DBD9D4; --rule-soft:#E9E7E3; --accent:#111214;
  --radius:2px; --pad:clamp(16px,4vw,40px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--pad) 80px}

header{border-bottom:1px solid var(--ink);padding:30px 0 14px;margin-bottom:26px}
.eyebrow{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
h1{margin:0;font-family:"Playfair Display",serif;font-size:clamp(26px,4.4vw,40px);font-weight:700;letter-spacing:-.01em}
header p.sub{margin:8px 0 0;font-size:13.5px;color:var(--muted);max-width:52ch}

.layout{display:grid;grid-template-columns:340px 1fr;gap:28px;align-items:start}
@media(max-width:860px){.layout{grid-template-columns:1fr}}

.controls{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:18px 19px}
.grp{margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--rule-soft)}
.grp:last-child{margin-bottom:0;padding-bottom:0;border-bottom:0}
.grp>h2{margin:0 0 12px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
.field{margin-bottom:11px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input[type=text],.field select{width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:var(--radius);background:#FDFDFC}
.field input:focus,.field select:focus,button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.seg{display:flex;border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden}
.seg button{flex:1;border:0;background:#FDFDFC;padding:8px 4px;font-size:12.5px;color:var(--muted);border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:500}
.corners{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.corners button{border:1px solid var(--rule);background:#FDFDFC;padding:9px 4px;font-size:12.5px;border-radius:var(--radius);color:var(--muted)}
.corners button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--ink)}
.rangerow{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:2px}
.rangerow b{font-family:"Playfair Display",serif;color:var(--ink)}

.stage{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:18px}
.stagebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stagebar .t{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.stagebar .sp{flex:1}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:8px 15px;border-radius:var(--radius);font-size:13.5px;font-weight:500}
.btn:hover{opacity:.85}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--ink);opacity:1}
.btn[disabled]{opacity:.35;cursor:not-allowed}

.canvasbox{position:relative;width:100%;display:flex;justify-content:center;background:
  repeating-conic-gradient(#E6E4E0 0% 25%, #F4F3F1 0% 50%) 50%/22px 22px;border:1px solid var(--rule-soft);padding:10px}
.canvasstack{position:relative;line-height:0;max-width:100%}
.canvasstack canvas{display:block;max-width:100%;height:auto}
#overlayC{position:absolute;inset:0;width:100%;height:100%}
.hint{font-size:12.5px;color:var(--dim);margin:12px 0 0;line-height:1.55}
.drop{border:1px dashed var(--rule);border-radius:var(--radius);padding:11px;text-align:center;font-size:12.5px;color:var(--muted);cursor:pointer}
.drop:hover{border-color:var(--ink);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:var(--ink);color:#fff;padding:9px 18px;border-radius:99px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .2s ease;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">HERFULSINS · Project Plate</p>
    <h1>作品資訊卡產生器</h1>
    <p class="sub">填一次欄位，導出透明 PNG 疊在影片上，或直接合成到照片。每支影片、每張照片都掛同一組外框。</p>
  </header>

  <div class="layout">
    <!-- ══ 控制 ══ -->
    <div class="controls">
      <div class="grp">
        <h2>作品</h2>
        <div class="field"><label for="fEn">作品名稱（英文）</label><input type="text" id="fEn" value="Refined Tower" placeholder="Opulent Dwelling"></div>
        <div class="field"><label for="fZh">作品名稱（中文）</label><input type="text" id="fZh" value="澄澈" placeholder="留白之間"></div>
        <div class="field"><label for="fType">案件類型</label>
          <select id="fType">
            <option>老屋翻新</option><option>新成屋</option><option>預售屋客變</option>
            <option>商業空間</option><option>自地自建</option><option>局部改造</option><option>軟裝配置</option>
          </select></div>
        <div class="field"><label for="fLoc">地點</label><input type="text" id="fLoc" value="嘉義市"></div>
        <div class="field"><label for="fDesigner">設計師</label><input type="text" id="fDesigner" value="" placeholder="陳○○"></div>
        <div class="field"><label for="fStatus">狀態標記</label>
          <select id="fStatus"><option value="">不顯示</option><option>On going Project</option><option>Completed</option></select></div>
      </div>

      <div class="grp">
        <h2>版式</h2>
        <div class="field"><label>內容</label>
          <div class="seg" id="segMode">
            <button data-mode="plate" aria-pressed="true">資訊卡</button>
            <button data-mode="mark" aria-pressed="false">只放浮水印</button>
          </div></div>
        <div class="field"><label>顏色</label>
          <div class="seg" id="segColor">
            <button data-color="#FFFFFF" aria-pressed="true">白字</button>
            <button data-color="#111214" aria-pressed="false">黑字</button>
          </div></div>
        <div class="field"><label>襯底（讓字浮出來）</label>
          <div class="seg" id="segBack">
            <button data-back="grad" aria-pressed="true">漸層</button>
            <button data-back="block" aria-pressed="false">色塊</button>
            <button data-back="none" aria-pressed="false">無</button>
          </div></div>
        <div class="field" id="bdRow">
          <div class="rangerow"><span>襯底濃度</span><b id="bdLabel">55%</b></div>
          <input type="range" id="fBackdrop" min="10" max="90" value="55"></div>
        <div class="field"><label>位置</label>
          <div class="corners" id="segPos">
            <button data-pos="tl" aria-pressed="true">左上</button>
            <button data-pos="tr" aria-pressed="false">右上</button>
            <button data-pos="bl" aria-pressed="false">左下</button>
            <button data-pos="br" aria-pressed="false">右下</button>
          </div></div>
        <div class="field">
          <div class="rangerow"><span>不透明度</span><b id="opLabel">92%</b></div>
          <input type="range" id="fOpacity" min="30" max="100" value="92"></div>
        <div class="field">
          <div class="rangerow"><span>整體大小</span><b id="szLabel">100%</b></div>
          <input type="range" id="fScale" min="60" max="150" value="100"></div>
      </div>

      <div class="grp">
        <h2>畫布</h2>
        <div class="field"><label for="fRatio">比例（沒有底圖時）</label>
          <select id="fRatio">
            <option value="1080x1920">直式影片 9:16 · 1080×1920</option>
            <option value="1080x1350">IG 貼文 4:5 · 1080×1350</option>
            <option value="1080x1080">方形 1:1 · 1080×1080</option>
            <option value="1920x1080">橫式 16:9 · 1920×1080</option>
          </select></div>
        <div class="field">
          <div class="drop" id="dropZone">放一張照片進來，或點這裡選檔</div>
          <input type="file" id="fPhoto" accept="image/*" hidden>
        </div>
        <button class="btn ghost" id="clearPhoto" style="width:100%" disabled>移除底圖</button>
      </div>
    </div>

    <!-- ══ 預覽 ══ -->
    <div class="stage">
      <div class="stagebar">
        <span class="t" id="dims">1080 × 1920</span>
        <span class="sp"></span>
        <button class="btn ghost" id="dlOverlay">下載透明 PNG</button>
        <button class="btn" id="dlFlat" disabled>下載合成圖</button>
      </div>
      <div class="canvasbox">
        <div class="canvasstack" id="stack">
          <canvas id="baseC"></canvas>
          <canvas id="overlayC"></canvas>
        </div>
      </div>
      <p class="hint">透明 PNG 給剪映／CapCut 用：新增圖片圖層、鋪滿整個畫面、不要縮放，位置就會對。有底圖時「下載合成圖」會用照片原始解析度輸出。</p>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

const $=s=>document.querySelector(s);
const state={
  mode:"plate", color:"#FFFFFF", pos:"tl", opacity:.92, scale:1,
  back:"grad", backAmt:.55, ratio:[1080,1920], photo:null
};
let markTinted={}, wordTinted={}, ready=false;

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1900);}

/* 把灰階遮罩染成指定顏色 */
function tint(img,hex){
  const c=document.createElement("canvas");c.width=img.width;c.height=img.height;
  const x=c.getContext("2d");x.drawImage(img,0,0);
  const d=x.getImageData(0,0,c.width,c.height), p=d.data;
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  for(let i=0;i<p.length;i+=4){ const a=p[i]; p[i]=r;p[i+1]=g;p[i+2]=b;p[i+3]=a; }
  x.putImageData(d,0,0); return c;
}
function loadImg(src){return new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.src=src;});}

function setLS(ctx,px){ try{ ctx.letterSpacing=px+"px"; }catch(e){} }

/* ───── 繪製 ───── */
function drawOverlay(ctx,W,H,keep){
  if(!keep) ctx.clearRect(0,0,W,H);   // keep=true：疊在既有內容上，不要清掉底圖
  const s=(W/1080)*state.scale;
  const col=state.color, light=col==="#FFFFFF";
  const mark=markTinted[col], word=wordTinted[col];
  if(!mark||!word) return;

  ctx.save();
  ctx.globalAlpha=state.opacity;
  if(light){ ctx.shadowColor="rgba(0,0,0,.55)"; ctx.shadowBlur=14*s; ctx.shadowOffsetY=1*s; }
  else{ ctx.shadowColor="rgba(255,255,255,.55)"; ctx.shadowBlur=14*s; ctx.shadowOffsetY=1*s; }

  const M=58*s;
  const plate=state.mode==="plate";

  /* 量測 */
  const markH=plate?44*s:34*s;
  const markW=mark.width/mark.height*markH;
  const wordH=plate?17*s:15*s;
  const wordW=word.width/word.height*wordH;

  const en=$("#fEn").value.trim(), zh=$("#fZh").value.trim();
  const rows=[["TYPE",$("#fType").value],["LOCATION",$("#fLoc").value.trim()],
              ["DESIGNER",$("#fDesigner").value.trim()]].filter(r=>r[1]);
  const status=$("#fStatus").value;

  let blockW, blockH;
  if(plate){
    ctx.font=`500 ${34*s}px "Playfair Display",serif`;
    const enW=en?ctx.measureText(en).width:0;
    ctx.font=`500 ${19*s}px "Noto Serif TC",serif`;
    const zhW=zh?ctx.measureText(zh).width:0;
    blockW=Math.max(markW+14*s+wordW, enW, zhW, 250*s);
    blockH=markH + 24*s + 36*s + (en?32*s:0) + (zh?24*s:0) + 10*s
           + rows.length*23*s + (status?30*s:0);
  }else{
    blockW=markW+12*s+wordW; blockH=markH;
  }

  const right=state.pos==="tr"||state.pos==="br";
  const bottom=state.pos==="bl"||state.pos==="br";
  const x0=right? W-M-blockW : M;
  const y0=bottom? H-M-blockH : M;

  /* — 襯底 — */
  if(state.back!=="none" && state.backAmt>0){
    ctx.save();
    ctx.shadowColor="transparent"; ctx.shadowBlur=0; ctx.shadowOffsetY=0;
    ctx.globalAlpha=1;
    const base=light?"0,0,0":"255,255,255";
    const a=state.backAmt;
    if(state.back==="grad"){
      // 從所在角落斜向淡出，只壓住卡片附近
      const cx=right?W:0, cy=bottom?H:0;
      const reach=Math.max(blockW,blockH)+300*s;
      const ex=right?W-reach:reach, ey=bottom?H-reach:reach;
      const g=ctx.createLinearGradient(cx,cy,ex,ey);
      g.addColorStop(0,`rgba(${base},${a})`);
      g.addColorStop(.45,`rgba(${base},${a*.55})`);
      g.addColorStop(1,`rgba(${base},0)`);
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    }else{
      const px=30*s, py=26*s;
      const bx=x0-px, by=y0-py, bw=blockW+px*2, bh=blockH+py*2;
      ctx.fillStyle=`rgba(${base},${a})`;
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(bx,by,bw,bh,4*s);
      else ctx.rect(bx,by,bw,bh);
      ctx.fill();
    }
    ctx.restore();
  }

  /* — 品牌列 — */
  ctx.drawImage(mark,x0,y0,markW,markH);
  const wx=x0+markW+ (plate?14*s:12*s);
  if(plate){
    ctx.fillStyle=col; ctx.textBaseline="alphabetic";
    setLS(ctx,2.6*s);
    ctx.font=`400 ${9.5*s}px "Noto Sans TC",sans-serif`;
    ctx.globalAlpha=state.opacity*.78;
    ctx.fillText("DESIGN & RENOVATION", wx, y0+14*s);
    ctx.globalAlpha=state.opacity;
    setLS(ctx,0);
    ctx.drawImage(word, wx, y0+22*s, wordW, wordH);
  }else{
    ctx.drawImage(word, wx, y0+(markH-wordH)/2, wordW, wordH);
  }

  if(!plate){ ctx.restore(); return; }

  /* — 分隔線 — */
  let y=y0+markH+24*s;
  ctx.globalAlpha=state.opacity*.38;
  ctx.strokeStyle=col; ctx.lineWidth=Math.max(1,1*s);
  ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x0+blockW,y); ctx.stroke();
  ctx.globalAlpha=state.opacity;
  y+=36*s;

  /* — 作品名 — */
  if(en){
    ctx.fillStyle=col; setLS(ctx,.5*s);
    ctx.font=`500 ${34*s}px "Playfair Display",serif`;
    ctx.fillText(en,x0,y); y+=32*s;
  }
  if(zh){
    ctx.globalAlpha=state.opacity*.82;
    ctx.font=`500 ${19*s}px "Noto Serif TC",serif`;
    setLS(ctx,3.2*s);
    ctx.fillText(zh,x0,y); y+=24*s;
    ctx.globalAlpha=state.opacity;
  }
  setLS(ctx,0);
  y+=10*s;

  /* — 欄位 — */
  rows.forEach(([k,v])=>{
    ctx.globalAlpha=state.opacity*.58;
    setLS(ctx,1.8*s);
    ctx.font=`400 ${9.5*s}px "Noto Sans TC",sans-serif`;
    ctx.fillText(k,x0,y);
    ctx.globalAlpha=state.opacity;
    setLS(ctx,.6*s);
    ctx.font=`400 ${12.5*s}px "Noto Sans TC",sans-serif`;
    ctx.fillText(v,x0+92*s,y);
    y+=23*s;
  });

  /* — 狀態 — */
  if(status){
    y+=10*s;
    setLS(ctx,2.2*s);
    ctx.font=`400 ${10*s}px "Playfair Display",serif`;
    const tw=ctx.measureText(status).width;
    ctx.globalAlpha=state.opacity*.5;
    ctx.strokeStyle=col; ctx.lineWidth=Math.max(1,1*s);
    ctx.strokeRect(x0,y-11*s,tw+18*s,20*s);
    ctx.globalAlpha=state.opacity*.9;
    ctx.fillText(status,x0+9*s,y+2*s);
  }
  setLS(ctx,0);
  ctx.restore();
}

/* ───── 尺寸與渲染 ───── */
function dims(){
  if(state.photo) return [state.photo.naturalWidth,state.photo.naturalHeight];
  return state.ratio;
}
function render(){
  if(!ready) return;
  const [W,H]=dims();
  const base=$("#baseC"), ov=$("#overlayC");
  base.width=W; base.height=H; ov.width=W; ov.height=H;
  const bx=base.getContext("2d");
  bx.clearRect(0,0,W,H);
  if(state.photo){ bx.drawImage(state.photo,0,0,W,H); }
  else{ bx.fillStyle="#2A2B2E"; bx.fillRect(0,0,W,H); }
  const maxH=Math.min(620,window.innerHeight*0.72);
  const disp=Math.min(1,maxH/H);
  $("#stack").style.width=(W*disp)+"px";
  base.style.width="100%"; base.style.height="auto";
  drawOverlay(ov.getContext("2d"),W,H);
  $("#dims").textContent=`${W} × ${H}`;
}

function dl(canvas,name){
  canvas.toBlob(b=>{
    const u=URL.createObjectURL(b), a=document.createElement("a");
    a.href=u; a.download=name; a.click();
    setTimeout(()=>URL.revokeObjectURL(u),1000);
  },"image/png");
}
function slug(){
  const n=($("#fEn").value||$("#fZh").value||"plate").trim().replace(/\s+/g,"-");
  return n;
}

/* ───── 事件 ───── */
["fEn","fZh","fType","fLoc","fDesigner","fStatus"].forEach(id=>
  $("#"+id).addEventListener("input",render));
$("#fStatus").addEventListener("change",render);
$("#fType").addEventListener("change",render);

function segWire(sel,key,cast){
  document.querySelectorAll(sel+" button").forEach(b=>b.addEventListener("click",()=>{
    document.querySelectorAll(sel+" button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
    state[key]=cast(b.dataset[key]||b.dataset.mode||b.dataset.color||b.dataset.pos);
    render();
  }));
}
document.querySelectorAll("#segMode button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("#segMode button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  state.mode=b.dataset.mode; render();
}));
document.querySelectorAll("#segColor button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("#segColor button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  state.color=b.dataset.color; render();
}));
document.querySelectorAll("#segPos button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("#segPos button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  state.pos=b.dataset.pos; render();
}));
document.querySelectorAll("#segBack button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("#segBack button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  state.back=b.dataset.back;
  $("#bdRow").style.display=state.back==="none"?"none":"";
  render();
}));
$("#fBackdrop").addEventListener("input",e=>{state.backAmt=e.target.value/100;$("#bdLabel").textContent=e.target.value+"%";render();});
$("#fOpacity").addEventListener("input",e=>{state.opacity=e.target.value/100;$("#opLabel").textContent=e.target.value+"%";render();});
$("#fScale").addEventListener("input",e=>{state.scale=e.target.value/100;$("#szLabel").textContent=e.target.value+"%";render();});
$("#fRatio").addEventListener("change",e=>{state.ratio=e.target.value.split("x").map(Number);render();});

function loadPhoto(file){
  if(!file||!file.type.startsWith("image/")) return;
  const u=URL.createObjectURL(file), im=new Image();
  im.onload=()=>{ state.photo=im; $("#clearPhoto").disabled=false; $("#dlFlat").disabled=false; render(); };
  im.src=u;
}
$("#dropZone").addEventListener("click",()=>$("#fPhoto").click());
$("#fPhoto").addEventListener("change",e=>loadPhoto(e.target.files[0]));
["dragover","dragenter"].forEach(ev=>$("#dropZone").addEventListener(ev,e=>{e.preventDefault();}));
$("#dropZone").addEventListener("drop",e=>{e.preventDefault();loadPhoto(e.dataTransfer.files[0]);});
$("#clearPhoto").addEventListener("click",()=>{
  state.photo=null; $("#clearPhoto").disabled=true; $("#dlFlat").disabled=true; $("#fPhoto").value=""; render();
});

$("#dlOverlay").addEventListener("click",()=>{
  const [W,H]=dims(); const c=document.createElement("canvas"); c.width=W;c.height=H;
  drawOverlay(c.getContext("2d"),W,H);
  dl(c,`${slug()}_overlay_${W}x${H}.png`); toast("透明 PNG 已下載");
});
$("#dlFlat").addEventListener("click",()=>{
  if(!state.photo) return;
  const [W,H]=dims(); const c=document.createElement("canvas"); c.width=W;c.height=H;
  const x=c.getContext("2d"); x.drawImage(state.photo,0,0,W,H); drawOverlay(x,W,H,true);
  dl(c,`${slug()}_${W}x${H}.png`); toast("合成圖已下載");
});
window.addEventListener("resize",render);

/* ───── 啟動 ───── */
(async function(){
  const [m,w]=await Promise.all([loadImg(MARK_MASK),loadImg(WORD_MASK)]);
  ["#FFFFFF","#111214"].forEach(c=>{ markTinted[c]=tint(m,c); wordTinted[c]=tint(w,c); });
  try{
    await document.fonts.load('500 40px "Playfair Display"');
    await document.fonts.load('500 20px "Noto Serif TC"');
    await document.fonts.load('400 14px "Noto Sans TC"');
    await document.fonts.ready;
  }catch(e){}
  ready=true; render();
})();
})();
</script>
</body>
